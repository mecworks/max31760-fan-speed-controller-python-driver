name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: Quality gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPython transport dependency (Linux-only)
        run: pip install smbus2
      - name: Unit & integration tests (mock-backed)
        run: python -m unittest discover tests -v
      - name: API coverage gate
        run: python tools/api_coverage.py
      - name: MicroPython-subset lint gate
        run: python tests/lint_subset.py
      - name: Syntax gate
        run: python -m compileall max31760
